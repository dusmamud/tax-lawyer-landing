<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- interactive-widget=resizes-content: when the keyboard opens on Android,
			the viewport shrinks so the fixed mobile call bar and chat input move
			above the keyboard instead of being covered by it. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/logo.svg" />
		<!-- Google Analytics 4 — replace G-XXXXXXXXXX with your real Measurement ID (Google Analytics > Admin > Data Streams). Until then no data is collected. -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());
			gtag('config', 'G-XXXXXXXXXX');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
